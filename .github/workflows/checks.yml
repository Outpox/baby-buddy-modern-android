# Runs the pre-commit hooks (.pre-commit-config.yaml), a debug build and the unit tests on every push and
# pull request, so the checks hold even for commits made without the hooks installed.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4 # ktlint runs on Java
        with:
          distribution: temurin
          java-version: "21"
      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK and run the unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
